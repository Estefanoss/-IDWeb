<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro para sistema de gestión académica</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="contenedor">
        <div class="card">
            <header class="card-header">
                <h1>Registro de Estudiantes</h1> 
            </header>

            <form action="/procesar" method="get" class="form-container">
                
                <fieldset>
                    <legend>Datos personales</legend>

                    <div class="form-group">
                        <label for="nombres" class="form-label">Nombres y Apellidos Completos:</label>
                        <input 
                            type="text" 
                            id="nombres" 
                            name="nombres" 
                            class="form-input" 
                            placeholder="Ej. Oscar Bobadilla Soto" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cui" class="form-label">CUI:</label>
                        <input 
                            type="text" 
                            id="cui" 
                            name="cui" 
                            class="form-input" 
                            placeholder="Ej. 20261188" 
                            pattern="[0-9]{8}" 
                            title="El código debe tener exactamente 8 dígitos numéricos" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="fecha" class="form-label">Fecha de nacimiento:</label>
                        <input 
                            type="date" 
                            id="fecha" 
                            name="fecha" 
                            class="form-input" 
                            min="2000-01-01" 
                            max="2010-01-01" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="edad" class="form-label">Edad:</label>
                        <input 
                            type="number" 
                            id="edad" 
                            name="edad" 
                            class="form-input" 
                            min="17" 
                            max="30" 
                            placeholder="17-30" 
                            required
                        >
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Datos académicos</legend>

                    <div class="form-group">
                        <label for="email" class="form-label">Correo Institucional:</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="usuario@universidad.edu.pe" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña:</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            pattern="(?=.*\d)(?=.*[A-Z]).{8,}" 
                            placeholder="Al menos 1 mayúscula y 1 número" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="carrera" class="form-label">Carrera Profesional:</label>
                        <select id="carrera" name="carrera" class="form-input" required>
                            <option value="" disabled selected>Seleccione una carrera</option>
                            <option value="sistemas">Ing. de Sistemas</option>
                            <option value="industrial">Ing. Industrial</option>
                            <option value="telecomunicaciones">Ing. de Telecomunicaciones</option>
                            <option value="computacion">Cs. de la Computación</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Turno:</label>
                        <div class="radio-group">
                            <label for="manana" class="radio-label">
                                <input 
                                type="radio" 
                                id="manana" 
                                name="turno" 
                                value="manana" required
                                > Mañana
                            </label>
                            <label for="tarde" class="radio-label">
                                <input 
                                type="radio"
                                id="tarde" 
                                name="turno" 
                                value="tarde"
                                > Tarde
                            </label>
                            <label for="noche" class="radio-label">
                                <input type="radio" 
                                id="noche" 
                                name="turno" 
                                value="noche"
                                > Noche
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comentarios" class="form-label">Comentarios:</label>
                        <textarea 
                            id="comentarios" 
                            name="comentarios" 
                            class="form-input" 
                            rows="3" 
                            placeholder="Ingrese algún comentario"
                        ></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label for="terminos" class="checkbox-label">
                            <input type="checkbox" id="terminos" name="terminos" required> 
                            Acepto los términos y condiciones.
                        </label>
                    </div>
                </fieldset>

                <div class="botones-group">
                    <button type="submit" class="btn btn-primary">Registrar</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>Derechos reservados. Oscar Estefano Bobadilla Soto.</p>
    </footer>

</body>
</html>
