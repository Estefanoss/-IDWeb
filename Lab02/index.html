<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro para sistema de gestión académica</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
<body>

<main>

    <header class="card-header">
        <h1>Registro de Estudiantes</h1>
    </header>

    <form action="/procesar" method="get" class="form-container">
        <fieldset>
            <legend>Datos de Acceso</legend>

            <div class="form-group">
                <label for="cui" class="form-label">CUI: </label>
                <input
                    type="cui" 
                    id="cui" 
                    name="cui" 
                    required placeholder="Ej. 20261188" 
                    pattern="[0-9]{8}" 
                    title="El código debe tener exactamente 8 dígitos numéricos"
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Correo Institucional:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input"
                    required placeholder="usuario@universidad.edu.pe">
            </div>
        </fieldset>
    </form>
