<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Tareas Académicas</title>

<!-- Bootstrap 5 -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">

    <!-- Encabezado -->
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div id="alert-container"></div>

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">
                        Gestión de Tareas Académicas
                    </h1>
                </div>

                <div class="card-body">

                    <!-- Formulario -->
                    <form id="todo-form" class="mb-4">

                        <div class="input-group">
                            <div class="col-md-4">
                                <label 
                                for="todo-titulo" 
                                class="form-label 
                                fw-bold">Tarea
                                </label>

                                <input 
                                type="text" 
                                id="todo-titulo" 
                                class="form-control" 
                                placeholder="Ej. Informe Final" 
                                autocomplete="off">
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Agregar Tarea
                            </button>
                        </div>

                    </form>

                    <!-- Lista de tareas -->
                    <h2 class="h5 mb-3">
                        Lista de tareas
                    </h2>

                    <ul
                        id="todo-list"
                        class="list-group"
                    >
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript de la aplicación -->
<script src="app.js"></script>

</body>
</html>
