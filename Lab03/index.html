<!DOCTYPE html>
<html lang="esp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Universitario</title>

    <!--importe de Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="Stylesheet" href="estilos.css">
</head>

<body>
    <!--cabezera-->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold">Portal Académico</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!--Barra de Navegación-->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="#cursos" >Cursos</a></li>
                        <li class="nav-item"><a class="nav-link" href="#noticias">Noticias y Eventos</a></li>
                    </ul>
                    <!--flex column para movil y flex grap para pantallas grandes-->
                    <div class="d-flex gap-2 flex-column flex-lg-row">
                        <a href="#inicioSesion" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                        <a href="#registro" class="btn btn-warning btn-sm fw-bold">Registrarse</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!--Frase motivadora e imagen-->
        <section id="inicio" class="hero-section">
            <div class="hero-text">
                <h1>No dejes para mañana lo que puedes hacer hoy.</h1>
            </div>
            
            <div class="hero-image">
                <img src="fotoSistemas.jpg" alt="Escuela profesional de ingenieria de sistemas.">
            </div>

        </section>

    </main>


</body>
